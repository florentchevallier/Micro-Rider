<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro Rider</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--fond:#081326;--carte:#0c1c34;--trait:#2f4663;--texte:#e8f3ff;--doux:#9db4d0;--accent:#63e5de}
body{margin:0;background:var(--fond);color:var(--texte);font:14px system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:12px 18px}
header,.barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0 auto 0 0;font-size:20px;font-style:italic;color:var(--accent)}
button,select,input[type=number]{background:#1a304b;border:1px solid #44607f;color:#fff;padding:8px 12px;border-radius:7px;font:inherit;cursor:pointer}
button:disabled,select:disabled,input:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffdd79}
button[aria-pressed=true]{background:#2a5a70;border-color:var(--accent)}
button.conn{display:flex;align-items:center;gap:8px}
button.conn::before{content:"";width:9px;height:9px;border-radius:50%;background:#6b7a90}
button.conn.att::before{background:#ffd24a}button.conn.ok::before{background:#4bd86f}
label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--doux)}
input[type=number]{width:72px;cursor:text}
.sep{width:1px;height:26px;background:var(--trait)}
#etatSeance{font-size:12px;color:var(--doux);min-width:150px}
#info{min-height:18px;color:#ffd7a0;font-size:12px;margin:4px 0 8px}
.stage{text-align:center}
#promenade{width:100%;max-width:calc((100svh - 210px) * 1200 / 1022);min-width:320px;display:block;margin:0 auto;border-radius:11px;border:1px solid var(--trait)}
[hidden]{display:none!important}
details{background:var(--carte);border:1px solid var(--trait);border-radius:9px;padding:8px 12px;margin-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--doux)}
.curseurs{display:grid;grid-template-columns:90px 1fr 60px;gap:8px 12px;align-items:center;max-width:520px;margin-top:10px;font-size:12px}
.curseurs output{text-align:right;font-family:monospace}
input[type=range]{width:100%;accent-color:#64e1d4}
#journal{max-height:240px;overflow:auto;background:#050c18;border-radius:6px;padding:8px;font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;margin:8px 0 0}
.libelle-vue{font-size:12px;line-height:1.3}.libelle-vue small{display:block;color:var(--doux);font-size:10px}
.rocker{position:relative;width:43px;height:51px;padding:0;flex-shrink:0;border:4px solid #242930;border-radius:6px;background:linear-gradient(#ff8648,#eb431b 49%,#9b240d 51%,#dc3c18);box-shadow:0 2px 3px #000,inset 0 1px 2px #ffce8a;transform:perspective(110px) rotateX(-12deg);color:#ffe9bb;font:bold 13px monospace;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.rocker[aria-checked=true]{background:linear-gradient(#ca3213,#f15e26 49%,#fd7739 51%,#b52b0e);transform:perspective(110px) rotateX(12deg);border-color:#353b43;box-shadow:0 0 12px #ff681c33}
#optArcade{align-items:center}
.sortie{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--doux)}
.sortie button{padding:6px 10px;font-size:12px}
.rapport{display:flex;align-items:center;gap:6px}
.rapport button{width:36px;padding:8px 0;font-weight:bold;font-size:16px;line-height:1;transition:background .08s,box-shadow .08s}
.rapport button.flash{background:var(--accent);color:#04202a;border-color:#fff;box-shadow:0 0 12px var(--accent)}
.rapport .valeur{min-width:62px;text-align:center;font:bold 18px monospace;color:var(--accent)}
.rapport .valeur small{font-size:11px;color:var(--doux)}
.rapport.sans-effet .valeur{color:var(--doux)}
.touches{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;justify-content:start;margin-top:10px;font-size:12px}
.touches kbd{background:#050c18;border:1px solid var(--trait);border-radius:5px;padding:3px 9px;font:12px ui-monospace,monospace;min-width:70px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1>micro rider</h1>
    <button data-mode="promenade" aria-pressed="true">Promenade</button>
    <button data-mode="arcade" aria-pressed="false">Arcade</button>
    <span class="sep"></span>
    <button id="bTrainer" class="conn"><span class="txt">Connecter le trainer</span></button>
    <button id="bFc" class="conn"><span class="txt">Connecter le cardio</span></button>
    <button id="bClick" class="conn"><span class="txt">Connecter le Click</span></button>
  </header>

  <div class="barre" aria-label="Séance d'entraînement">
    <label>Séance <select id="seance"></select></label>
    <label class="fichier"><button type="button" onclick="document.getElementById('fichier').click()">Charger un fichier…</button>
      <input id="fichier" type="file" accept=".zwo,.json,.fit" hidden></label>
    <label>FTP <input id="ftp" type="number" min="50" max="600" step="5" value="250"> W</label>
    <button id="bDemarrer" disabled>Démarrer</button>
    <button id="bArreter" disabled>Arrêter</button>
    <span id="etatSeance"></span>
    <span class="sep"></span>
    <span class="sortie" id="groupeSortie">
      <span id="etatSortie" aria-live="polite">Sortie : rien d'enregistré</span>
      <button id="bTcx" disabled title="Télécharger la sortie au format .tcx (Strava, Garmin Connect, TrainingPeaks…)">Télécharger .tcx</button>
      <button id="bNouvelle" disabled title="Effacer la sortie enregistrée et repartir de zéro">Nouvelle sortie</button>
    </span>
    <span class="sep"></span>
    <span class="rapport" id="groupeRapport" role="group" aria-label="Rapport virtuel">
      <button id="bMoins" aria-label="Rapport plus facile" title="Plus facile">−</button>
      <span class="valeur" id="rapport" aria-live="polite">10<small>/24</small></span>
      <button id="bPlus" aria-label="Rapport plus dur" title="Plus dur">+</button>
    </span>
    <span class="sep"></span>
    <span id="optPromenade"><label>Revêtement <select id="surface"></select></label></span>
    <span id="optArcade" hidden style="display:flex;gap:10px">
      <label>Borne <select id="borne"></select></label>
      <label>Monde <select id="monde"></select></label>
      <button class="rocker" id="bascule" role="switch" aria-checked="false" aria-label="Mode jeu, grand écran"><span>I</span><span>O</span></button>
      <span id="libelleVue" class="libelle-vue"></span>
    </span>
  </div>
  <div id="info" role="status" aria-live="polite"></div>

  <div class="stage">
    <canvas id="promenade" aria-label="Promenade : cycliste de profil sur une rue illustrée, avec la séance en dessous"></canvas>
    <div id="arcade" hidden></div>
  </div>

  <details id="sim">
    <summary>Simulation (sans matériel)</summary>
    <div class="curseurs">
      <label for="sP">Puissance</label><input id="sP" type="range" min="0" max="500" step="5" value="150"><output id="oP"></output>
      <label for="sC">Cadence</label><input id="sC" type="range" min="0" max="140" step="1" value="85"><output id="oC"></output>
      <label for="sF">Cardio</label><input id="sF" type="range" min="0" max="200" step="1" value="130"><output id="oF"></output>
      <label for="suivre" style="grid-column:1/3">La puissance suit la cible de la séance</label><input id="suivre" type="checkbox">
    </div>
  </details>
  <details>
    <summary>Options : touches du clavier</summary>
    <div class="touches">
      <span>Rapport plus dur (+)</span><kbd id="kPlus"></kbd><button id="cPlus">Changer…</button>
      <span>Rapport plus facile (−)</span><kbd id="kMoins"></kbd><button id="cMoins">Changer…</button>
    </div>
    <div class="petit" id="infoTouches" style="font-size:12px;color:var(--doux);margin-top:8px">Les rapports ne s'appliquent qu'en résistance libre : pendant un palier ERG, la séance impose la puissance.</div>
  </details>
  <details>
    <summary>Journal Bluetooth</summary>
    <button id="bCopier" style="margin-top:8px">Copier le journal</button>
    <pre id="journal"></pre>
  </details>
</main>
<script src="js/assets.js"></script>
<script src="js/parseurs.js"></script>
<script src="js/noyau.js"></script>
<script src="js/seances.js"></script>
<script src="js/sortie.js"></script>
<script src="js/ble.js"></script>
<script src="js/click.js"></script>
<script src="js/mode-promenade.js"></script>
<script src="js/mode-arcade.js"></script>
<script src="js/app.js"></script>
</body>
</html>
