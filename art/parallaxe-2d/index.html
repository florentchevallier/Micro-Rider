<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro Rider • La côte électrique</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1630;color:#eff6ff;font-family:system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{font-weight:900;font-style:italic;font-size:25px;letter-spacing:-1px;color:#64f7d0}.tag{font-size:11px;letter-spacing:2px;color:#98a9c9}h1{font-size:19px;margin:5px 0}button,select{background:#203253;color:#fff;border:1px solid #506182;border-radius:8px;padding:11px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffdb72}.screen{position:relative;border:1px solid #4e6990;border-radius:14px;overflow:hidden;box-shadow:0 22px 65px #0005}canvas{width:100%;display:block;image-rendering:pixelated}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:24px;padding:22px 0}label{font-size:13px;color:#aebed8;display:flex;align-items:center;gap:10px}input{accent-color:#61f6c9;width:150px}output{color:#fff;min-width:65px;font-variant-numeric:tabular-nums}footer{font-size:12px;color:#8c9dbd;line-height:1.6}#error{color:#ffb5b5}@media(max-width:650px){main{padding:12px}header{align-items:flex-start}.tag{font-size:9px}h1{font-size:15px}.controls{gap:15px}label{flex-wrap:wrap}}
</style><main><header><div><div class="brand">micro rider</div><h1>La côte électrique</h1><div class="tag">PROTOTYPE 02 / DÉFILEMENT HORIZONTAL</div></div><select id="world" aria-label="Ambiance"><option value="coast">Côte ensoleillée</option><option value="night">Ville électrique</option></select></header><div class="screen"><canvas id="game" width="960" height="540" aria-label="Cycliste de profil devant un paysage en parallaxe"></canvas></div><div class="controls"><button id="play">Pause</button><label>Vitesse <input id="speed" type="range" min="0" max="60" value="28"><output id="sv">28 km/h</output></label><label>Cadence <input id="cadence" type="range" min="0" max="120" value="80"><output id="cv">80 rpm</output></label></div><footer>Un grand cycliste au premier plan, cinq plans de décor à des vitesses différentes. Vitesse et cadence se règlent séparément.<br>Sprite de pédalage conservé pour les tests. Aucun branchement au home trainer à cette étape.</footer><p id="error" role="alert"></p></main><script src="atlas.js"></script><script>
const canvas=document.querySelector('#game'),g=canvas.getContext('2d'),$=s=>document.querySelector(s);let riding=!matchMedia('(prefers-reduced-motion: reduce)').matches,travel=0,phase=0,elapsed=0,last=null,loaded=false;const rider=new Image();rider.onload=()=>loaded=true;rider.onerror=()=>$('#error').textContent='Le sprite du cycliste ne peut pas être chargé.';rider.src='pedalage.png';
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}function poly(points,c){g.fillStyle=c;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function text(t,x,y,size=12,color='#fff'){g.fillStyle=color;g.font=`bold ${size}px monospace`;g.fillText(t,x,y)}
function repeat(span,factor,fn){const offset=travel*factor%span;for(let x=-span-offset;x<960+span;x+=span)fn(x)}
function cloud(x,y){rect(x,y,96,12,'#e5fbff');rect(x+12,y-12,66,12,'#f6ffff');rect(x+30,y-22,32,10,'#f6ffff')}
function palm(x,y,h,night){rect(x,y-h,7,h,night?'#34395d':'#a85b42');rect(x+2,y-h,2,h,'#e2a26c');for(let side of [-1,1]){poly([[x+3,y-h],[x+side*35,y-h-15],[x+side*63,y-h+4],[x+side*29,y-h-3]],night?'#226c77':'#147e74');poly([[x+3,y-h],[x+side*18,y-h-30],[x+side*37,y-h-22],[x+side*15,y-h-13]],night?'#38a19d':'#23b58b')}}
function draw(){const night=$('#world').value==='night';g.imageSmoothingEnabled=false;rect(0,0,960,540,night?'#191b4d':'#69d7f3');
if(night){for(let i=0;i<45;i++)rect((i*127+31)%960,(i*41)%230,2,2,'#c2bfff');rect(766,67,49,49,'#ffe6b3');rect(755,60,43,43,'#191b4d')}else{rect(755,65,72,72,'#fff2a2');rect(746,78,90,47,'#fff2a2');repeat(480,.035,x=>cloud(x+80,95));repeat(690,.05,x=>cloud(x+280,165))}
repeat(620,.09,x=>{poly([[x,300],[x+110,170],[x+160,170],[x+270,295],[x+410,214],[x+620,300]],night?'#393568':'#78acd2');poly([[x+94,188],[x+110,170],[x+160,170],[x+185,200],[x+153,190],[x+130,199]],night?'#695589':'#c3e7ee')});
rect(0,294,960,115,night?'#292c65':'#1caecb');repeat(180,.2,x=>{rect(x,317,60,2,night?'#665a91':'#7ae7e5');rect(x+84,342,45,2,night?'#4e4e85':'#a2f2e3');rect(x+30,373,90,2,night?'#555b91':'#6cddd9')});
repeat(560,.32,x=>{for(let i=0;i<5;i++){const bx=x+i*96,h=[78,115,91,146,69][i],y=337-h;rect(bx,y,75,h,night?['#323659','#353958','#3a4264'][i%3]:['#ffd28a','#f99c7e','#e5ebbc'][i%3]);rect(bx-3,y-6,81,6,night?'#a360ad':'#c06565');for(let row=0;row<Math.floor(h/22)-1;row++)for(let col=0;col<3;col++){rect(bx+10+col*21,y+12+row*22,11,13,night?(row%2?'#53c7cf':'#ffd095'):'#4f8194');rect(bx+10+col*21,y+12+row*22,11,2,night?'#ffeeac':'#ffe5bf')}}if(night){rect(x+98,239,67,21,'#ee509c');text('ARCADE',x+102,254,13);rect(x+291,204,56,20,'#45dfd4');text('VELO',x+302,218,12,'#153753')}});
rect(0,337,960,26,night?'#455070':'#e9b77e');repeat(160,.5,x=>{rect(x,346,130,3,night?'#6a7390':'#ffdbab');rect(x+130,337,3,26,night?'#282d50':'#bb845a')});
repeat(540,.58,x=>{palm(x+410,370,155,night);rect(x+44,321,5,49,night?'#696889':'#617b8a');rect(x+44,317,30,5,night?'#a3e5f4':'#526e87');rect(x+66,322,14,5,night?'#ffdf8b':'#fff2af')});
rect(0,363,960,10,night?'#b69ca2':'#fff0ca');rect(0,373,960,99,night?'#343e56':'#52677d');rect(0,373,960,4,'#273951');repeat(140,1,x=>rect(x,434,76,5,night?'#ead8aa':'#e5eece'));
// Rider stays near the left third; all eight accepted poses share one display rectangle.
g.fillStyle='#10223950';g.beginPath();g.ellipse(278,462,103,7,0,0,Math.PI*2);g.fill();if(loaded){const f=RIDER_ATLAS.pedalage.frames[Math.floor(phase)%8];g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(rider,f.x,f.y,f.w,f.h,166,238,232,232);g.imageSmoothingEnabled=false}
rect(0,472,960,7,night?'#e4a4b9':'#fff0c7');rect(0,479,960,61,night?'#22263e':'#bd7859');repeat(64,1.15,x=>{rect(x,479,32,8,night?'#8f567a':'#f4bb7e');rect(x+32,487,32,8,night?'#724c70':'#e29d6a');rect(x,503,28,4,night?'#393251':'#a56754')});repeat(440,1.24,x=>{poly([[x+30,540],[x+46,510],[x+56,532],[x+68,501],[x+80,540]],night?'#17616d':'#206e62');rect(x+65,519,5,5,'#ffb855');rect(x+47,526,5,5,'#fc739a')});
// Compact HUD, outside the cyclist silhouette.
rect(22,20,270,55,'#102540');rect(22,20,4,55,'#64f7d0');text(night?'02 / VILLE ÉLECTRIQUE':'01 / LA CÔTE ÉLECTRIQUE',38,43,13,'#64f7d0');text('BALADE LIBRE',38,63,12,'#b7cde6');rect(691,20,247,55,'#102540');text($('#speed').value+' KM/H',708,45,20,'#ffe27b');text($('#cadence').value+' RPM',834,45,15,'#72eee1');text((travel/22000).toFixed(2)+' KM',708,64,11,'#b7cde6');text('CAP SUR LA PROMENADE →',704,102,12,night?'#d3b7ff':'#1f5878');}
function tick(t){const dt=last===null?0:Math.min(.05,(t-last)/1000);last=t;if(riding){travel+=Number($('#speed').value)*4*dt;phase+=Number($('#cadence').value)/60*8*dt;elapsed+=dt}draw();requestAnimationFrame(tick)}function sync(){ $('#sv').value=$('#speed').value+' km/h';$('#cv').value=$('#cadence').value+' rpm';$('#play').textContent=riding?'Pause':'Lecture';$('#play').setAttribute('aria-pressed',String(riding))}$('#play').onclick=()=>{riding=!riding;sync()};document.querySelectorAll('input').forEach(e=>e.oninput=sync);sync();requestAnimationFrame(tick);
</script></html>
