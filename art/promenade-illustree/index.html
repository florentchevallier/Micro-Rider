<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro Rider — Promenade illustrée</title><style>*{box-sizing:border-box}body{margin:0;background:#081426;color:#e7f3ff;font:14px system-ui}main{max-width:1450px;margin:auto;padding:18px}.bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:0 0 14px}.bar strong{color:#48e5ec;margin-right:auto}button{background:#15314b;border:1px solid #43728c;color:#fff;border-radius:6px;padding:9px 18px;cursor:pointer}input{accent-color:#4ee6d7}label{display:flex;align-items:center;gap:10px}canvas{width:100%;display:block;border-radius:8px}p{font-size:12px;color:#99aec4}button:focus-visible,input:focus-visible{outline:3px solid #ffde6d}</style><main><div class="bar"><strong>MICRO RIDER · PROMENADE ILLUSTRÉE</strong><label>Vitesse <input id="speed" type="range" min="0" max="60" value="24"><output id="speed-value">24 km/h</output></label><label>Cadence <input id="cadence" type="range" min="0" max="120" value="80"><output id="value">80 rpm</output></label><button id="play">Pause</button></div><canvas id="scene" width="1536" height="1024" aria-label="Cycliste animé sur la voie de droite d’une route côtière illustrée"></canvas><p>Essai de mouvement : chaussée en défilement, léger suivi de caméra et reflets sur la mer. Vitesse et cadence indépendantes. Le paysage n’est pas encore un décor continu ; les données de l’illustration restent fixes.</p><p id="error" role="alert"></p></main><script src="atlas.js"></script><script>
const $=s=>document.querySelector(s),c=$('#scene'),g=c.getContext('2d');let phase=0,distance=0,clock=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,ready=false;const bg=new Image(),rider=new Image();function load(im,src){return new Promise((yes,no)=>{im.onload=yes;im.onerror=()=>no(Error('Impossible de charger '+src));im.src=src})}Promise.all([load(bg,'decor.png'),load(rider,'pedalage.png')]).then(()=>ready=true).catch(e=>$('#error').textContent=e.message);function roadFlow(){
 const v=Number($('#speed').value);if(!v)return;
 g.save();g.beginPath();g.moveTo(0,810);g.lineTo(1536,500);g.lineTo(1536,565);g.lineTo(790,775);g.lineTo(710,818);g.lineTo(0,818);g.closePath();g.clip();
 // Sparse short road flecks follow the road direction, below the fixed rider.
 for(let i=0;i<105;i++){
 const x=((i*193-distance*(.8+(i%5)*.1))%1700+1700)%1700-80;
 const y=844-x*.205+(i%7)*9;
 g.strokeStyle=i%3?'rgba(21,33,52,.20)':'rgba(235,206,164,.22)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+9+v*.35,y-(9+v*.35)*.205);g.stroke();
 }g.restore();
}
function draw(){if(!ready)return;g.clearRect(0,0,c.width,c.height);g.drawImage(bg,0,0,1536,1024);
 // Restrained camera drift is confined to the illustration; the HUD stays still.
 const drift=Math.sin(distance/1600)*7;
 g.save();g.beginPath();g.rect(0,62,1536,758);g.clip();g.drawImage(bg,-23+drift,-12,1582,1054);g.restore();
 roadFlow();
 g.save();g.beginPath();g.rect(1040,281,342,96);g.clip();for(let i=0;i<18;i++){const x=1050+(i*47+clock*9)%320,y=297+(i*19)%69;g.globalAlpha=.12+.17*(1+Math.sin(clock*2+i))/2;g.fillStyle='#fff2bd';g.fillRect(x,y,4+i%5,1)}g.restore();
 g.save();g.translate(500,620+(Number($('#speed').value)>0?Math.sin(distance*.06)*.8:0));g.rotate(-.20);g.fillStyle='#0b19383d';g.beginPath();g.ellipse(0,166,145,10,0,0,Math.PI*2);g.fill();let f=RIDER_ATLAS.pedalage.frames[Math.floor(phase)%8];g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(rider,f.x,f.y,f.w,f.h,-175,-175,350,350);g.restore()}function tick(t){let dt=last===null?0:Math.min(.05,(t-last)/1000);last=t;if(playing){phase=(phase+dt*Number($('#cadence').value)/60*8)%8;distance+=dt*Number($('#speed').value)*7;clock+=dt;}draw();requestAnimationFrame(tick)}function sync(){$('#play').textContent=playing?'Pause':'Lecture';$('#play').setAttribute('aria-pressed',String(playing));$('#value').value=$('#cadence').value+' rpm';$('#speed-value').value=$('#speed').value+' km/h'}$('#cadence').oninput=sync;$('#speed').oninput=sync;$('#play').onclick=()=>{playing=!playing;sync()};sync();requestAnimationFrame(tick);
</script></html>
