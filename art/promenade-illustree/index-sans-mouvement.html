<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro Rider — Promenade illustrée</title><style>*{box-sizing:border-box}body{margin:0;background:#081426;color:#e7f3ff;font:14px system-ui}main{max-width:1450px;margin:auto;padding:18px}.bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:0 0 14px}.bar strong{color:#48e5ec;margin-right:auto}button{background:#15314b;border:1px solid #43728c;color:#fff;border-radius:6px;padding:9px 18px;cursor:pointer}input{accent-color:#4ee6d7}label{display:flex;align-items:center;gap:10px}canvas{width:100%;display:block;border-radius:8px}p{font-size:12px;color:#99aec4}button:focus-visible,input:focus-visible{outline:3px solid #ffde6d}</style><main><div class="bar"><strong>MICRO RIDER · PROMENADE ILLUSTRÉE</strong><label>Cadence <input id="cadence" type="range" min="0" max="120" value="80"><output id="value">80 rpm</output></label><button id="play">Pause</button></div><canvas id="scene" width="1536" height="1024" aria-label="Cycliste animé sur la voie de droite d’une route côtière illustrée"></canvas><p>Test d’intégration visuelle : cycliste animé séparé du décor. Le fond et les données de l’illustration restent fixes.</p><p id="error" role="alert"></p></main><script src="atlas.js"></script><script>
const $=s=>document.querySelector(s),c=$('#scene'),g=c.getContext('2d');let phase=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,ready=false;const bg=new Image(),rider=new Image();function load(im,src){return new Promise((yes,no)=>{im.onload=yes;im.onerror=()=>no(Error('Impossible de charger '+src));im.src=src})}Promise.all([load(bg,'decor.png'),load(rider,'pedalage.png')]).then(()=>ready=true).catch(e=>$('#error').textContent=e.message);function draw(){if(!ready)return;g.clearRect(0,0,c.width,c.height);g.drawImage(bg,0,0,1536,1024);g.save();g.translate(500,620);g.rotate(-.20);g.fillStyle='#0b19383d';g.beginPath();g.ellipse(0,166,145,10,0,0,Math.PI*2);g.fill();let f=RIDER_ATLAS.pedalage.frames[Math.floor(phase)%8];g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(rider,f.x,f.y,f.w,f.h,-175,-175,350,350);g.restore()}function tick(t){let dt=last===null?0:Math.min(.05,(t-last)/1000);last=t;if(playing)phase=(phase+dt*Number($('#cadence').value)/60*8)%8;draw();requestAnimationFrame(tick)}function sync(){$('#play').textContent=playing?'Pause':'Lecture';$('#play').setAttribute('aria-pressed',String(playing));$('#value').value=$('#cadence').value+' rpm'}$('#cadence').oninput=sync;$('#play').onclick=()=>{playing=!playing;sync()};sync();requestAnimationFrame(tick);
</script></html>
