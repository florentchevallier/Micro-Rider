<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro Rider — Pavés en contexte</title><style>*{box-sizing:border-box}body{margin:0;background:#0c182a;color:#eef5fc;font:14px system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:22px}p{color:#a8bfd3}nav{position:sticky;top:0;background:#0c182af2;padding:14px 0;display:flex;flex-wrap:wrap;gap:10px;z-index:2}button{background:#20374e;border:1px solid #64849b;color:#fff;border-radius:7px;padding:12px 25px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#176b6a;border-color:#7ff3da}canvas{width:100%;display:block;border:1px solid #48607b;border-radius:9px}output{color:#8fe6db}a{color:#8fe6db}</style><main><h1>Compression des pavés dans la scène</h1><p>Même scène, même cycliste et même largeur des pavés. Seule leur compression verticale change.</p><nav><button data-f="0.75" aria-pressed="false">75 %</button><button data-f="0.625" aria-pressed="false">62,5 %</button><button data-f="0.5" aria-pressed="true">50 %</button><button data-f="0.375" aria-pressed="false">37,5 %</button><button data-f="0.25" aria-pressed="false">25 %</button></nav><p><output id="angle"></output></p><canvas id="scene" width="1200" height="800"></canvas><p>Vues fixes. Raccords non corrigés, comme convenu. <a href="index.html">Voir les trois bandes côte à côte dans la page de comparaison</a></p><p id="error" role="alert"></p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),images={};let factor=.5,ready=false;
function draw(){if(!ready)return;const top=636*800/1024;g.clearRect(0,0,1200,800);const grad=g.createLinearGradient(0,0,0,500);grad.addColorStop(0,'#39a9f6');grad.addColorStop(1,'#a3e2fa');g.fillStyle=grad;g.fillRect(0,0,1200,800);g.drawImage(images.nuages,0,-219,1800,600);g.drawImage(images.lointain,0,-40,1440,480);
g.save();g.beginPath();g.rect(0,top,1200,800-top);g.clip();g.transform(1,0,.45,factor,0,top);const im=images.paves,w=700,h=w*im.height/im.width;for(let y=0;y<(800-top)/factor+h;y+=h)for(let x=-1400;x<1800;x+=w)g.drawImage(im,x,y,w,h);g.restore();
g.drawImage(images['facades-paves'],0,0,1200,800);g.fillStyle='#10233940';g.beginPath();g.ellipse(350,664,107,6,0,0,Math.PI*2);g.fill();g.drawImage(images.pedalage,0,0,444,444,220,412,260,260);document.querySelector('#angle').textContent=String(factor*100).replace('.',',')+' % — '+(Math.atan(.45/factor)*180/Math.PI).toFixed(1).replace('.',',')+'° depuis la verticale';}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{factor=Number(b.dataset.f);document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});Promise.all(['paves','facades-paves','lointain','nuages','pedalage'].map(k=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{images[k]=im;ok()};im.onerror=()=>no(Error('Chargement impossible : '+k));im.src=k+'.png'}))).then(()=>{ready=true;draw()}).catch(e=>document.querySelector('#error').textContent=e.message);
</script></html>
