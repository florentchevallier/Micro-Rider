<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro Rider — choisissez votre monde</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#fff6e3;background:#07132e}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 35% 40%,#203f79 0,#0b1b3c 48%,#060c1d 100%)}main{min-height:100svh;max-width:1250px;margin:auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);align-items:center;gap:30px;padding:18px 38px}.machine{position:relative;width:min(100%,62svh);aspect-ratio:2/3;justify-self:center;isolation:isolate;filter:drop-shadow(0 25px 35px #0005)}.cabinet{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;z-index:0}.screen{position:absolute;left:24.2%;top:15.7%;width:52.7%;height:47.6%;border-radius:5% / 3.5%;overflow:hidden;background:#0b1734;z-index:1;box-shadow:inset 0 0 10px #000}.scene{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .16s}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 14px 3px #0008;border-radius:inherit;background:linear-gradient(125deg,#ffffff0b,transparent 32%)}.off .scene{opacity:0}.eyebrow{color:#ffcd28;letter-spacing:3px;font-size:11px;font-weight:800;margin:0 0 13px}h1{font-size:clamp(28px,4vw,47px);line-height:1.03;margin:0 0 15px;letter-spacing:-1.5px}header p{color:#b9c7e2;font-size:14px;line-height:1.6;margin:0 0 26px}.choices{display:grid;gap:10px}button{font:inherit;cursor:pointer}.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #ffffff24;background:#ffffff06;border-radius:13px;padding:10px;color:#f9f5e8;transition:background .15s,border-color .15s,transform .15s}.choice:hover{background:#ffffff10;transform:translateX(3px)}.choice[aria-pressed=true]{border-color:#ffca26;background:#ffca2611;box-shadow:0 0 0 1px #ffca2633}.choice img{width:57px;height:69px;object-fit:cover;border-radius:7px}.choice strong{display:block;font-size:15px;margin-bottom:6px}.choice small{display:block;color:#b9c7e2;font-size:12px;line-height:1.4}.number{margin-left:auto;color:#ffca26;font-size:12px;padding-right:7px}.actions{display:flex;gap:10px;margin-top:20px;align-items:center}.secondary{background:#fff1;border:1px solid #fff3;border-radius:20px;padding:9px 15px;color:#d7e1f5;font-size:12px}.secondary:hover{background:#fff2}footer{margin-top:20px;font-size:11px;color:#8193b5;line-height:1.5}button:focus-visible,a:focus-visible{outline:3px solid #ffcf2e;outline-offset:4px}a{color:#9edfdc}.caption{display:block;color:#a9c5f3;font-size:12px;margin-top:14px;min-height:18px}.loading{opacity:.3}@media(max-width:700px){main{grid-template-columns:1fr;gap:12px;padding:10px 20px 30px}.machine{width:min(100%,57svh)}aside{max-width:430px;margin:auto;width:100%}h1{font-size:28px}header p{margin-bottom:16px}.eyebrow{margin-bottom:8px}.choice img{height:48px;width:48px}.choices{gap:7px}.choice{padding:7px}.caption{margin-top:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main>
<div class="machine"><img class="cabinet" src="option-3/borne-90s.png" alt="Borne Micro Rider bleu électrique avec bandes flashy années 90"><div class="screen"><img id="scene" class="scene" src="parcours.png" alt="Cycliste sur une route alpine en lacets"></div></div>
<aside><header><p class="eyebrow">MICRO RIDER · SELECT YOUR WORLD</p><h1>Trois mondes.<br>Une seule borne.</h1><p>Choisis ton terrain de jeu et retrouve chaque univers dans la borne.</p></header>
<div class="choices" role="group" aria-label="Choisir le visuel du jeu">
<button class="choice" data-index="0" aria-pressed="true"><img src="parcours.png" alt=""><span><strong>Le grand col</strong><small>Alpes, lacets et sommet à conquérir.</small></span><span class="number">01</span></button>
<button class="choice" data-index="1" aria-pressed="false"><img src="parcours-option-2.png" alt=""><span><strong>La montagne en briques</strong><small>Un diorama à explorer, virage après virage.</small></span><span class="number">02</span></button>
<button class="choice" data-index="2" aria-pressed="false"><img src="option-3/minimonde.png" alt=""><span><strong>La ville miniature</strong><small>Pont, marina et petites routes de jouet.</small></span><span class="number">03</span></button>
</div>
<span class="caption" id="status" aria-live="polite">À l’écran : Le grand col</span>
<div class="actions"><button class="secondary" id="power" aria-pressed="false">Éteindre l’écran</button><a class="secondary" id="full" href="parcours.png" target="_blank" rel="noopener">Voir le visuel entier ↗</a></div>
<footer>Exploration graphique · images fixes<br>Utilise aussi les flèches ← → pour changer d’univers.</footer></aside>
</main><script>
const worlds=[{src:'parcours.png',name:'Le grand col',alt:'Cycliste sur une route alpine en lacets'},{src:'parcours-option-2.png',name:'La montagne en briques',alt:'Cycliste de profil dans une montagne miniature en briques'},{src:'option-3/minimonde.png',name:'La ville miniature',alt:'Cycliste dans une ville de jouet avec pont orange et marina'}];
const scene=document.querySelector('#scene'),machine=document.querySelector('.machine'),buttons=[...document.querySelectorAll('.choice')],power=document.querySelector('#power');let index=0;
function turnOn(){machine.classList.remove('off');power.setAttribute('aria-pressed','false');power.textContent='Éteindre l’écran'}
function select(n){index=(n+worlds.length)%worlds.length;const w=worlds[index];scene.src=w.src;scene.alt=w.alt;buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));document.querySelector('#status').textContent='À l’écran : '+w.name;document.querySelector('#full').href=w.src;turnOn();try{localStorage.setItem('micro-rider-world',String(index))}catch{}}
buttons.forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.index))));power.addEventListener('click',()=>{if(machine.classList.contains('off'))turnOn();else{machine.classList.add('off');power.setAttribute('aria-pressed','true');power.textContent='Allumer l’écran'}});document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();select(index+(e.key==='ArrowRight'?1:-1));buttons[index].focus()}});try{const saved=localStorage.getItem('micro-rider-world');if(saved!==null&&['0','1','2'].includes(saved))select(Number(saved));else select(2)}catch{select(2)}
</script></body></html>
